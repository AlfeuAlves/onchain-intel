<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CriptoGuia AI - Bitcoin Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .sidebar { background-color: #181a20; border-right: 1px solid #2b3139; z-index: 1000; transition: all 0.3s ease; }
        .card { background-color: #1e2329; border: 1px solid #2b3139; border-radius: 12px; }
        .accent-orange { color: #f7931a; }
        .logo-box { background: linear-gradient(135deg, #f7931a 0%, #ffab40 100%); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(247, 147, 26, 0.3); }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; width: 260px; }
            .sidebar.active { left: 0; }
            .content-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 900; }
            .content-overlay.active { display: block; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div id="overlay" class="content-overlay" onclick="toggleMenu()"></div>
    <aside id="sidebar" class="sidebar w-64 flex-shrink-0 flex flex-col">
        <div class="p-6 flex items-center gap-3 border-b border-gray-800">
            <div class="logo-box"><i class="fas fa-compass text-white text-sm"></i></div>
            <div class="flex flex-col">
                <span class="text-lg font-black tracking-tighter leading-none">CriptoGuia <span class="text-orange-500">AI</span></span>
                <span class="text-[8px] text-gray-500 font-bold tracking-widest uppercase">By GabrielBot</span>
            </div>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="dashboard-onchain.html" class="flex items-center p-3 rounded hover:bg-gray-800 text-gray-400"><i class="fas fa-chart-line mr-3"></i> Visão Geral</a>
            <a href="bitcoin-intel.html" class="flex items-center p-3 rounded bg-orange-600 text-white font-bold"><i class="fab fa-bitcoin mr-3"></i> Bitcoin</a>
            <a href="ethereum-intel.html" class="flex items-center p-3 rounded hover:bg-gray-800 text-gray-400"><i class="fab fa-ethereum mr-3"></i> Ethereum</a>
            <a href="solana-intel.html" class="flex items-center p-3 rounded hover:bg-gray-800 text-gray-400"><i class="fas fa-bolt mr-3"></i> Solana</a>
            <a href="settings.html" class="flex items-center p-3 rounded hover:bg-gray-800 text-gray-400"><i class="fas fa-cog mr-3"></i> Configurações</a>
        </nav>
        <footer class="p-4 border-t border-gray-800 text-[9px] text-gray-600 text-center font-bold tracking-widest uppercase">
            &copy; 2026 CriptoGuia AI
        </footer>
    </aside>

    <main class="flex-grow flex flex-col overflow-hidden">
        <header class="h-14 flex items-center justify-between px-4 border-b border-gray-700 bg-gray-900/80">
            <div class="flex items-center gap-2">
                <button onclick="toggleMenu()" class="md:hidden text-orange-500 text-lg p-2 mr-2"><i class="fas fa-bars"></i></button>
                <div class="md:hidden flex items-center gap-2">
                    <div class="logo-box w-6 h-6"><i class="fas fa-compass text-white text-[10px]"></i></div>
                    <span class="text-xs font-black tracking-tighter">CriptoGuia <span class="text-orange-500">AI</span></span>
                </div>
            </div>
            <div class="relative group cursor-pointer">
                <input type="file" id="photo-input" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
                <img id="user-photo" onclick="document.getElementById('photo-input').click()" src="https://ui-avatars.com/api/?name=Alfeu+Alves&background=f7931a&color=fff" class="w-8 h-8 rounded-full border-2 border-orange-500 shadow-lg object-cover" alt="Perfil">
            </div>
        </header>

        <div class="flex-grow overflow-y-auto p-4 space-y-6">
            <!-- HERO PREÇO -->
            <div class="card bg-gradient-to-r from-orange-600/20 to-transparent p-6 border-l-4 border-orange-500">
                <div class="text-[9px] uppercase font-bold text-orange-500 tracking-widest mb-1">Cotação Atual (BTC/USD)</div>
                <div class="flex items-baseline gap-3">
                    <div class="text-4xl md:text-6xl font-black text-white" id="hero-price">$102,540</div>
                    <div class="text-lg font-bold" id="hero-change">+1.2%</div>
                </div>
            </div>

            <!-- TOKENOMIA -->
            <div class="card p-5 border-l-4 border-yellow-500">
                <h2 class="text-xs font-bold mb-3 flex items-center gap-2"><i class="fas fa-gem text-yellow-500"></i> Escassez Digital</h2>
                <div class="flex justify-between text-[8px] mb-1"><span>Circulação (94%)</span><span>19.8M / 21M</span></div>
                <div class="w-full h-2 bg-gray-800 rounded-full overflow-hidden"><div class="h-full bg-yellow-500" style="width: 94%"></div></div>
            </div>

            <!-- FEED -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 pb-10">
                <div class="card p-5">
                    <h2 class="text-xs font-bold mb-4 uppercase tracking-widest text-orange-500">Fluxo em Tempo Real</h2>
                    <div id="tx-feed" class="space-y-2"></div>
                </div>
            </div>

            <footer class="text-center py-6 border-t border-gray-800/50">
                <span class="text-[10px] font-black tracking-tighter opacity-50">CriptoGuia <span class="text-orange-500">AI</span></span>
            </footer>
        </div>
    </main>
    <script>
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const b64 = e.target.result;
                    document.getElementById('user-photo').src = b64;
                    localStorage.setItem('userPhoto', b64);
                };
                reader.readAsDataURL(file);
            }
        }
        function genTx() { return { v: (Math.random() * 0.5).toFixed(4), h: "bc1q"+Math.random().toString(36).substr(2,6), t: new Date().toLocaleTimeString() }; }
        function render(txs) {
            const c = document.getElementById('tx-feed'); c.innerHTML = '';
            (txs && txs.length ? txs : [genTx(),genTx(),genTx()]).forEach(t => {
                c.innerHTML += `<div class="flex justify-between items-center p-2 bg-gray-800/50 rounded border border-gray-700 text-[10px] mb-2"><div class="flex items-center gap-2"><i class="fab fa-bitcoin text-orange-400"></i><span class="font-bold">${t.value || t.v} BTC</span></div><span class="text-gray-500">${t.timestamp || t.t}</span></div>`;
            });
        }
        async function load() {
            try {
                const mRes = await fetch('market-data.json'); if(mRes.ok) {
                    const m = await mRes.json(); const b = m.prices.btc;
                    document.getElementById('hero-price').innerText = `$${b.usd.toLocaleString()}`;
                    const ce = document.getElementById('hero-change'); ce.innerText = (b.change_24h>=0?'+':'')+b.change_24h.toFixed(2)+'%';
                    ce.style.color = b.change_24h>=0?'#02c076':'#cf304a';
                }
                const res = await fetch('raw-transactions.json'); render(res.ok ? await res.json() : null);
            } catch(e) { render(); }
            const savedPhoto = localStorage.getItem('userPhoto');
            if (savedPhoto) document.getElementById('user-photo').src = savedPhoto;
        }
        window.onload = () => { load(); setInterval(load, 15000); };
    </script>
</body>
</html>
