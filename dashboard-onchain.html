<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>On-Chain Intelligence System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        .sidebar { background-color: #181a20; border-right: 1px solid #2b3139; z-index: 1000; transition: all 0.3s ease; }
        .card { background-color: #1e2329; border: 1px solid #2b3139; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .ai-panel { background: linear-gradient(135deg, #1e2329 0%, #2b3139 100%); border: 1px solid #474d57; }
        .gauge-container { position: relative; width: 100%; max-width: 200px; height: 110px; margin: 0 auto; }
        .gauge-bg-path { fill: none; stroke-width: 12; stroke-linecap: round; }
        .pointer { fill: #ffffff; stroke: #000; stroke-width: 0.5; transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 50px 50px; }
        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; width: 260px; }
            .sidebar.active { left: 0; }
            .content-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 900; }
            .content-overlay.active { display: block; }
            .main-container { width: 100vw; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div id="overlay" class="content-overlay" onclick="toggleMenu()"></div>
    <aside id="sidebar" class="sidebar w-64 flex-shrink-0 flex flex-col">
        <div class="p-6 text-xl font-bold flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center gap-2"><i class="fas fa-brain text-blue-500"></i><span>ON-CHAIN</span></div>
            <button onclick="toggleMenu()" class="md:hidden text-gray-500"><i class="fas fa-times"></i></button>
        </div>
        <nav class="flex-grow p-4 space-y-2">
            <a href="dashboard-onchain.html" class="flex items-center p-3 rounded bg-blue-600 text-white font-bold"><i class="fas fa-chart-line mr-3"></i> Visão Geral</a>
            <a href="bitcoin-intel.html" class="flex items-center p-3 rounded hover:bg-gray-800"><i class="fab fa-bitcoin mr-3 text-orange-500"></i> Bitcoin</a>
            <a href="ethereum-intel.html" class="flex items-center p-3 rounded hover:bg-gray-800"><i class="fab fa-ethereum mr-3 text-blue-400"></i> Ethereum</a>
            <a href="solana-intel.html" class="flex items-center p-3 rounded hover:bg-gray-800"><i class="fas fa-bolt mr-3 text-green-400"></i> Solana</a>
            <a href="settings.html" class="flex items-center p-3 rounded hover:bg-gray-800"><i class="fas fa-cog mr-3"></i> Configurações</a>
        </nav>
    </aside>

    <main class="flex-grow flex flex-col overflow-hidden main-container">
        <header class="h-14 flex items-center justify-between px-4 border-b border-gray-700 bg-gray-900/80 backdrop-blur-md">
            <button onclick="toggleMenu()" class="md:hidden text-blue-500 text-lg p-2"><i class="fas fa-bars"></i></button>
            <div class="flex items-center gap-3 text-[10px] md:text-xs font-bold uppercase tracking-tighter">
                <span class="text-orange-500">BTC: $102k</span>
                <span class="text-blue-400 hidden sm:inline">ETH: $2.7k</span>
            </div>
            <div class="flex items-center gap-3">
                <div id="countdown" class="text-[9px] font-mono text-gray-500 bg-black/30 px-2 py-1 rounded">05:00</div>
                <!-- ÁREA DA FOTO DE PERFIL -->
                <div class="relative group cursor-pointer" onclick="changeProfilePhoto()">
                    <img id="user-photo" src="https://ui-avatars.com/api/?name=Alfeu+Alves&background=004a80&color=fff" class="w-8 h-8 rounded-full border-2 border-blue-500 shadow-lg object-cover" alt="Perfil">
                    <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <i class="fas fa-camera text-[10px] text-white"></i>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-grow overflow-y-auto p-4 md:p-8 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="card p-5 flex flex-col items-center">
                    <div class="text-gray-500 text-[9px] uppercase font-bold self-start mb-2">Sentimento Global</div>
                    <div class="gauge-container">
                        <svg viewBox="0 0 100 60">
                            <defs><linearGradient id="g1"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="50%" stop-color="#ffd24d"/><stop offset="100%" stop-color="#02c076"/></linearGradient></defs>
                            <path d="M 10 50 A 40 40 0 0 1 90 50" class="gauge-bg-path" stroke="url(#g1)" fill="none" />
                            <polygon id="ptr-global" points="50,2 45,12 55,12" class="pointer" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-end pb-1">
                            <div class="text-3xl font-black">17</div>
                            <div class="text-[9px] font-bold uppercase text-red-500">Medo extremo</div>
                        </div>
                    </div>
                </div>
                <div class="card p-5 flex flex-col items-center">
                    <div class="flex justify-between w-full mb-2">
                        <div class="text-gray-500 text-[9px] uppercase font-bold">Sentimento Ativo</div>
                        <select id="asset-selector" class="bg-gray-800 text-[9px] text-blue-400 border-none rounded px-1" onchange="updateAssetUI()">
                            <option value="btc">BITCOIN</option><option value="eth">ETHEREUM</option><option value="sol">SOLANA</option>
                        </select>
                    </div>
                    <div class="gauge-container">
                        <svg viewBox="0 0 100 60">
                            <path d="M 10 50 A 40 40 0 0 1 90 50" class="gauge-bg-path" stroke="url(#g1)" fill="none" />
                            <polygon id="ptr-asset" points="50,2 45,12 55,12" class="pointer" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-end pb-1">
                            <div class="text-3xl font-black" id="val-asset">50</div>
                            <div class="text-[9px] font-bold uppercase text-gray-500" id="lbl-asset">Neutro</div>
                        </div>
                    </div>
                </div>
                <div class="card p-5 border-l-4 border-blue-400">
                    <div class="text-gray-500 text-[9px] uppercase font-bold">Redes Sociais</div>
                    <div class="text-lg font-black uppercase mt-1">EXPLOSIVO</div>
                </div>
                <div class="card p-5"><div class="text-gray-500 text-[9px] uppercase font-bold">Fluxo ETF</div><div class="text-xl font-black text-green-500 mt-1">+$450M</div></div>
                <div class="card p-5"><div class="text-gray-500 text-[9px] uppercase font-bold">Status</div><div class="flex items-center gap-2 mt-2"><div class="h-2 w-2 rounded-full bg-green-500 animate-pulse"></div><div class="text-[10px] font-black uppercase">Online</div></div></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 card overflow-hidden">
                    <div class="p-4 border-b border-gray-800 font-bold text-xs uppercase tracking-widest text-blue-400">Últimas Transações</div>
                    <div id="tx-feed" class="p-2 space-y-2 max-h-[400px] overflow-y-auto"></div>
                </div>
                <div class="space-y-4 pb-10">
                    <div class="ai-panel p-5 rounded-xl border border-gray-700/50 shadow-2xl">
                        <div class="flex items-center gap-2 mb-3 text-blue-400"><i class="fas fa-robot"></i><span class="font-black text-[10px] uppercase">IA Intel</span></div>
                        <p class="text-gray-300 text-[11px] leading-relaxed">Índice em 17. O pânico domina o varejo.</p>
                    </div>
                    <div id="news-feed" class="card p-5 space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mentor Widget -->
    <div class="fixed bottom-4 right-4 z-[2000]">
        <button onclick="toggleMentor()" class="bg-blue-600 text-white w-12 h-12 rounded-full shadow-2xl flex items-center justify-center border-2 border-white/20"><i class="fas fa-comment-dots"></i></button>
        <div id="mentor-chat" class="hidden absolute bottom-14 right-0 w-[90vw] sm:w-80 bg-[#1e2329] border border-gray-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
            <div class="bg-blue-600 p-3 flex justify-between text-white text-[10px] font-bold uppercase"><span>Mentor GabrielBot</span><button onclick="toggleMentor()"><i class="fas fa-times"></i></button></div>
            <div id="mentor-messages" class="h-60 overflow-y-auto p-4 space-y-3 text-[10px]"></div>
            <div class="p-3 border-t border-gray-800 flex gap-2">
                <input type="text" id="mentor-input" placeholder="..." class="bg-gray-800 border-none rounded-lg text-xs flex-grow p-2 text-white outline-none" onkeypress="if(event.key==='Enter')sendMsg()">
                <button onclick="sendMsg()" class="text-blue-500 px-2"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const assetData = { btc: { s: 68 }, eth: { s: 42 }, sol: { s: 81 } };
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
        function toggleMentor() { document.getElementById('mentor-chat').classList.toggle('hidden'); }
        
        function changeProfilePhoto() {
            const current = document.getElementById('user-photo').src;
            const newUrl = prompt("Link da sua nova foto de perfil:", current);
            if (newUrl && newUrl.trim() !== "") {
                document.getElementById('user-photo').src = newUrl;
                localStorage.setItem('userPhoto', newUrl);
            }
        }

        async function sendMsg() {
            const i = document.getElementById('mentor-input'); const c = document.getElementById('mentor-messages');
            if (!i.value.trim()) return;
            const m = i.value; i.value = '';
            c.innerHTML += `<div class="bg-gray-700/50 p-2 rounded-lg text-right ml-6 text-gray-300">${m}</div>`;
            c.scrollTop = c.scrollHeight;
            try {
                const res = await fetch('http://localhost:8083/ask', { method: 'POST', body: JSON.stringify({ question: m }) });
                const d = await res.json();
                c.innerHTML += `<div class="bg-blue-600/20 p-2 rounded-lg mr-6 text-blue-100">${d.answer}</div>`;
            } catch (e) { c.innerHTML += `<div class="bg-red-900/20 p-2 rounded-lg mr-6 text-[9px]">Offline</div>`; }
            c.scrollTop = c.scrollHeight;
        }

        function setG(id, s) {
            const p = document.getElementById(id); if(!p) return;
            p.style.transform = `rotate(${(s * 1.8) - 90}deg)`;
        }
        function updateAssetUI() { 
            const s = assetData[document.getElementById('asset-selector').value].s;
            setG('ptr-asset', s); document.getElementById('val-asset').innerText = s;
            const lbl = document.getElementById('lbl-asset');
            lbl.innerText = s <= 49 ? "Medo" : s <= 74 ? "Ganância" : "Ganância Extrema";
        }
        
        async function loadData() {
            const c = document.getElementById('tx-feed'); const n = document.getElementById('news-feed');
            try {
                const resN = await fetch('market-news.json'); if(resN.ok) {
                    const nd = await resN.json(); n.innerHTML = '<div class="text-yellow-500 font-bold text-[9px] mb-2 uppercase">Plantão Cripto</div>';
                    nd.top_stories.slice(0,3).forEach(s => n.innerHTML += `<div class="text-white text-[10px] border-b border-gray-700/30 pb-2">${s}</div>`);
                }
                const resB = await fetch('raw-transactions.json'); if(resB.ok) {
                    const txs = await resB.json(); c.innerHTML = '';
                    txs.slice(0, 10).forEach(t => c.innerHTML += `<div class="flex justify-between items-center p-3 bg-gray-800/30 rounded border border-gray-700/50 text-[10px] mb-2"><div class="flex items-center gap-2"><i class="fab fa-bitcoin text-orange-500"></i><span class="font-bold">${t.value} BTC</span></div><span class="text-gray-500">${t.timestamp}</span></div>`);
                }
            } catch (e) {}
        }

        window.onload = () => {
            const savedPhoto = localStorage.getItem('userPhoto');
            if (savedPhoto) document.getElementById('user-photo').src = savedPhoto;
            setG('ptr-global', 17); updateAssetUI(); loadData();
            let tl = 300; 
            setInterval(() => {
                const min = Math.floor(tl / 60); const sec = tl % 60;
                document.getElementById('countdown').innerText = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                if (tl <= 0) tl = 300; else tl--;
            }, 1000);
        };
    </script>
</body>
</html>
